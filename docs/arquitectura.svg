<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Fondo propio para que se lea igual en tema claro y oscuro de GitHub -->
  <rect x="0" y="0" width="920" height="400" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <rect x="20" y="20" width="260" height="360" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="38" y="50" font-size="14.5" font-weight="700" fill="#0F172A">Pantallas · HTML, CSS y JS</text>
  <g font-size="13">
    <rect x="38" y="72" width="224" height="58" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
    <text x="150" y="96" text-anchor="middle" font-weight="600" fill="#134E4A">Computadora y celular</text>
    <text x="150" y="115" text-anchor="middle" font-size="11.5" fill="#0F766E">se instala como app (PWA)</text>
    <rect x="38" y="148" width="224" height="58" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
    <text x="150" y="172" text-anchor="middle" font-weight="600" fill="#134E4A">Gráficas propias</text>
    <text x="150" y="191" text-anchor="middle" font-size="11.5" fill="#0F766E">barras y calendarios sin librerías</text>
    <rect x="38" y="224" width="224" height="58" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
    <text x="150" y="248" text-anchor="middle" font-weight="600" fill="#134E4A">Comprobantes</text>
    <text x="150" y="267" text-anchor="middle" font-size="11.5" fill="#0F766E">copia cliente e interna, a PDF</text>
    <rect x="38" y="300" width="224" height="58" rx="10" fill="#F0FDFA" stroke="#14B8A6"/>
    <text x="150" y="324" text-anchor="middle" font-weight="600" fill="#134E4A">Reportes</text>
    <text x="150" y="343" text-anchor="middle" font-size="11.5" fill="#0F766E">filtros y descarga en Excel</text>
  </g>

  <rect x="330" y="20" width="260" height="360" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="348" y="50" font-size="14.5" font-weight="700" fill="#0F172A">Servidor · Python + Flask</text>
  <g font-size="13">
    <rect x="348" y="72" width="224" height="58" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="460" y="96" text-anchor="middle" font-weight="600" fill="#312E81">Reglas del dinero</text>
    <text x="460" y="115" text-anchor="middle" font-size="11.5" fill="#4338CA">sobres · entregas · caja chica</text>
    <rect x="348" y="148" width="224" height="58" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="460" y="172" text-anchor="middle" font-weight="600" fill="#312E81">Obras y materiales</text>
    <text x="460" y="191" text-anchor="middle" font-size="11.5" fill="#4338CA">gastos y saldos por obra</text>
    <rect x="348" y="224" width="224" height="58" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="460" y="248" text-anchor="middle" font-weight="600" fill="#312E81">Excel con openpyxl</text>
    <text x="460" y="267" text-anchor="middle" font-size="11.5" fill="#4338CA">reportes y respaldo completo</text>
    <rect x="348" y="300" width="224" height="58" rx="10" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="460" y="324" text-anchor="middle" font-weight="600" fill="#312E81">Autoprueba</text>
    <text x="460" y="343" text-anchor="middle" font-size="11.5" fill="#4338CA">prueba de punta a punta</text>
  </g>

  <rect x="660" y="20" width="240" height="360" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="678" y="50" font-size="14.5" font-weight="700" fill="#0F172A">Dónde viven los datos</text>
  <g font-size="13">
    <rect x="678" y="72" width="204" height="58" rx="10" fill="#FFF7ED" stroke="#F97316"/>
    <text x="780" y="96" text-anchor="middle" font-weight="600" fill="#7C2D12">En línea · Railway</text>
    <text x="780" y="115" text-anchor="middle" font-size="11.5" fill="#C2410C">gunicorn · sesión de un año</text>
    <rect x="678" y="148" width="204" height="58" rx="10" fill="#FFF7ED" stroke="#F97316"/>
    <text x="780" y="172" text-anchor="middle" font-weight="600" fill="#7C2D12">Cloud Firestore</text>
    <text x="780" y="191" text-anchor="middle" font-size="11.5" fill="#C2410C">datos y PDF de contratos</text>
    <rect x="678" y="224" width="204" height="58" rx="10" fill="#FFF7ED" stroke="#F97316"/>
    <text x="780" y="248" text-anchor="middle" font-weight="600" fill="#7C2D12">Firebase Auth</text>
    <text x="780" y="267" text-anchor="middle" font-size="11.5" fill="#C2410C">usuarios con acceso</text>
    <rect x="678" y="300" width="204" height="58" rx="10" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="780" y="324" text-anchor="middle" font-weight="600" fill="#1E293B">Sin internet</text>
    <text x="780" y="343" text-anchor="middle" font-size="11.5" fill="#475569">Excel local con respaldos</text>
  </g>

  <line x1="280" y1="101" x2="330" y2="101" stroke="#64748B" stroke-width="1.6" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <line x1="280" y1="329" x2="330" y2="253" stroke="#64748B" stroke-width="1.6" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <line x1="590" y1="101" x2="660" y2="101" stroke="#64748B" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="590" y1="101" x2="660" y2="177" stroke="#64748B" stroke-width="1.6" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <line x1="590" y1="253" x2="660" y2="329" stroke="#64748B" stroke-width="1.6" marker-start="url(#flecha)" marker-end="url(#flecha)"/>
</svg>
